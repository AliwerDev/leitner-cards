services:
  php:
    build:
      context: ./docker/php
    container_name: leitner-php
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-leitner}
      DB_USER: ${POSTGRES_USER:-leitner}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      JWT_SECRET: ${JWT_SECRET:-change-me-please-32-chars-minimum}
      YII_DEBUG: ${YII_DEBUG:-true}
      YII_ENV: ${YII_ENV:-dev}
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - leitner

  nginx:
    image: nginx:1.27-alpine
    container_name: leitner-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - leitner

  frontend:
    image: node:22-alpine
    container_name: leitner-frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      # Inside the compose network nginx is reachable by service name.
      API_BASE_URL: http://nginx/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:${FRONTEND_PORT:-3000}
      NODE_ENV: development
      PORT: "3000"
      # Docker Desktop on Windows does not propagate inotify events from a
      # bind-mounted host filesystem, so HMR needs polling.
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Named volumes, not bind mounts: node_modules built on Windows contains
      # native binaries that do not run on alpine, and .next churns thousands
      # of files which is pathologically slow over a Windows bind mount.
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - nginx
    networks:
      - leitner

  db:
    image: postgres:16-alpine
    container_name: leitner-db
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leitner}
      POSTGRES_USER: ${POSTGRES_USER:-leitner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leitner} -d ${POSTGRES_DB:-leitner}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - leitner

volumes:
  pgdata:
  frontend_node_modules:
  frontend_next:

networks:
  leitner:
    driver: bridge
