# Throttles credential guessing on the auth endpoints. The application layer
# has no rate limiter: yii\filters\RateLimiter needs extra columns on the user
# table, and an unauthenticated login has no user to attach the counter to.
# 10m holds roughly 160k addresses.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

server {
    listen 80;
    server_name localhost;

    root /var/www/html/web;
    index index.php;

    charset utf-8;
    client_max_body_size 32M;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Login and register accept a burst of 5, then 5 requests per minute.
    # nodelay lets a legitimate retry through immediately instead of queueing it.
    # Over the limit nginx answers 429, which the client reads as a normal
    # error response.
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # A long query string plus a Bearer token overflows the default 4k
        # buffer and returns 502 instead of a real response.
        fastcgi_buffer_size 16k;
        fastcgi_buffers 8 16k;
        fastcgi_busy_buffers_size 32k;

        try_files $uri =404;
    }

    location ~* /\. {
        deny all;
    }

    access_log /var/log/nginx/leitner.access.log;
    error_log  /var/log/nginx/leitner.error.log;
}
